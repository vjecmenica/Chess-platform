const cells=fen.split('/').flatMap((r,ri)=>{let f=0;return [...r].flatMap(p=>{if(/[1-8]/.test(p))return Array.from({length:+p},()=>({square:'abcdefgh'[f++]+(8-ri),piece:null}));return [{square:'abcdefgh'[f++]+(8-ri),piece:(p===p.toUpperCase()?'w':'b')+p.toUpperCase()}]})});
let flipped=false; let showPieces=true; const board=document.querySelector('.board'),select=document.querySelector('select');
function render(){const type=select.value,old=['natural','golden'].includes(type);board.style.backgroundImage=(old||type==='a-oak-squares-v2')?'none':'url('+type+'.jpg)';board.innerHTML='';const shown=flipped?[...cells].reverse():cells;
shown.forEach((c,i)=>{let el=document.createElement('div');el.className='square'+(['b8','d7'].includes(c.square)?' last':'');el.dataset.square=c.square;if(type==='a-oak-squares-v2'){const file=c.square.charCodeAt(0)-97,rank=8-Number(c.square[1]);el.style.backgroundImage='url(a-oak-squares-v2.jpg)';el.style.backgroundSize='800% 800%';el.style.backgroundPosition=(file*100/7)+'% '+(rank*100/7)+'%';}if(old){el.style.backgroundImage='url('+originals[type+'-'+((Math.floor(i/8)+i%8)%2?'dark':'light')]+')';el.style.backgroundPosition=([0,66.6667,33.3333,100][i%4])+'% '+([0,66.6667,33.3333,100][Math.floor((i%16)/4)])+'%';}if(c.piece && showPieces)el.innerHTML='<img alt="'+c.piece+'" src="'+pieces[c.piece]+'">';if(i%8===0||i>=56)el.innerHTML+='<span>'+c.square+'</span>';if(c.square==='e4')el.innerHTML+='<i class="hint"></i>';board.append(el)});
function center(s){const i=shown.findIndex(c=>c.square===s);return {x:(i%8)*100+50,y:Math.floor(i/8)*100+50}}
function arrow(a,b,color){const f=center(a),t=center(b),l=Math.hypot(t.x-f.x,t.y-f.y),dx=(t.x-f.x)/l,dy=(t.y-f.y)/l,p=(d,o)=>(f.x+dx*d-dy*o)+' '+(f.y+dy*d+dx*o),base=l-40;return '<path fill="'+color+'" fill-opacity=".72" d="M '+p(0,10)+' L '+p(base,10)+' L '+p(base,24)+' L '+t.x+' '+t.y+' L '+p(base,-24)+' L '+p(base,-10)+' L '+p(0,-10)+' Z"/>'}
board.insertAdjacentHTML('beforeend','<svg class="arrows" viewBox="0 0 800 800">'+arrow('c4','d5','#70bcee')+arrow('h4','h5','#f3b52b')+'</svg>');document.querySelector('#top').textContent=flipped?'White player · White':'Guest · Black';document.querySelector('#bottom').textContent=flipped?'Guest · Black':'White player · White';}
